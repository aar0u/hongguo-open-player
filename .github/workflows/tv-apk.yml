name: Build TV APK

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: Default backend address baked into the APK
        default: http://192.168.31.217:8899/
  push:
    branches:
      - tv
    paths:
      - 'tv-app/**'
      - '.github/workflows/tv-apk.yml'

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Transpile client for the TV's old WebView
        run: |
          mkdir -p tv-app/app/src/main/assets
          npx --yes esbuild@0.24.0 src/client/js/app.js --target=chrome66 \
            --banner:js="$(cat tv-app/legacy-banner.js)" \
            --outfile=tv-app/app/src/main/assets/app.js

      - name: Build debug APK
        working-directory: tv-app
        run: gradle --no-daemon assembleDebug -PserverUrl="${{ inputs.server_url || 'http://192.168.31.217:8899/' }}"

      - uses: actions/upload-artifact@v4
        with:
          name: hongguo-tv-apk
          path: tv-app/app/build/outputs/apk/debug/app-debug.apk
