name: Build TV APK

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: Default backend address baked into the APK
        default: http://192.168.31.217:8899/
  push:
    branches:
      - tv
    paths:
      - 'tv-app/**'
      - '.github/workflows/tv-apk.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Transpile client for the TV's old WebView
        run: bash tv-app/build-assets.sh

      - name: Build debug APK
        working-directory: tv-app
        run: gradle --no-daemon assembleDebug -PserverUrl="${{ inputs.server_url || 'http://192.168.31.217:8899/' }}"

      - uses: actions/upload-artifact@v4
        with:
          name: hongguo-tv-apk
          path: tv-app/app/build/outputs/apk/debug/app-debug.apk

      # Release assets of a public repo download without a login, unlike artifacts.
      - name: Publish to the tv-latest prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete tv-latest --cleanup-tag --yes || true
          gh release create tv-latest tv-app/app/build/outputs/apk/debug/app-debug.apk \
            --prerelease --target "$GITHUB_SHA" --title "TV APK (latest build)" \
            --notes "Debug APK built from $GITHUB_SHA"
